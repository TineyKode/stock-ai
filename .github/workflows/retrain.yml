name: Retrain Models

on:
  schedule:
    - cron: '0 18 * * 0'  # Every Sunday 6 PM UTC
  workflow_dispatch:

permissions:
  contents: write        # ← ADD THIS

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preprocess data
        run: python scripts/preprocessing/preprocess_data.py

      - name: Fetch historical sentiment (optional)
        env:
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
        run: python scripts/fetching/fetch_alpha_sentiment.py

      - name: Retrain models
        run: python scripts/training/retrain_models.py

      - name: Commit changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add models/ data/processed/kenya_features.csv
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Auto-retrain models"
          git push
